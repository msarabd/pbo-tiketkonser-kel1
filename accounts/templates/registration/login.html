{% extends 'ticketing/base.html' %}
{% load static %}

{% block content_wrapper %}
<!-- Menggunakan flex-grow-1 agar menempati sisa tinggi antara header dan footer -->
<div class="row g-0 flex-grow-1 w-100">
    
    <!-- Kolom Kiri: Gambar Static -->
    <div class="col-md-6 d-none d-md-block" style="background-image: url('{% static "images/login_bg.jpg" %}'); background-size: cover; background-position: center; min-height: 100%;">
    </div>

    <!-- Kolom Kanan: Form Login -->
    <div class="col-md-6 bg-white d-flex align-items-center justify-content-center p-4">
        <!-- Kotak pembatas internal agar form tidak terlalu melar -->
        <div class="w-100" style="max-width: 450px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark mb-1">Masuk ke KonserKU</h2>
                <p class="text-secondary small">Silakan masuk untuk melanjutkan pemesanan</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center">
                    Username atau password salah. Silakan coba lagi.
                </div>
            {% endif %}
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-dark text-start">
                    <label class="form-label small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                
                <div class="mb-4 text-dark text-start">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn w-100 fw-bold text-white py-2 shadow-sm" style="background-color: #112250; border-radius: 8px;">Masuk</button>
            </form>

            <div class="text-center mt-4 border-top pt-3">
                <span class="small text-secondary">Belum punya akun?</span>
                <a href="{% url 'accounts:register' %}" class="small fw-bold text-decoration-none" style="color: #FF8C00;"> Daftar sekarang</a>
            </div>
        </div>
    </div>

</div>
{% endblock %}
