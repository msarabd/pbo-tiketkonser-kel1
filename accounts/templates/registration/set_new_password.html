{% extends 'ticketing/base.html' %}
{% load static %}

{% block content_wrapper %}
<div class="row g-0 flex-grow-1 w-100">
    <!-- Kolom Kiri: Gambar Static -->
    <div class="col-md-6 d-none d-md-block" style="background-image: url('{% static "images/login_bg.jpg" %}'); background-size: cover; background-position: center; min-height: 100%;">
    </div>

    <!-- Kolom Kanan: Form Password Baru -->
    <div class="col-md-6 bg-white d-flex align-items-center justify-content-center p-4">
        <div class="w-100" style="max-width: 450px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark mb-1">Password Baru</h2>
                <p class="text-secondary small">Masukkan password baru untuk akun KonserKU kamu</p>
            </div>

            {% if form.errors %}
                <div class="alert alert-danger p-2 small text-center">
                    Konfirmasi password tidak cocok atau tidak memenuhi syarat.
                </div>
            {% endif %}

            <form method="POST" action="{% url 'accounts:set_new_password' %}">
                {% csrf_token %}
                <div class="mb-3 text-dark text-start">
                    <label class="form-label small fw-bold">Password Baru</label>
                    <input type="password" name="password" class="form-control" placeholder="Minimal 8 karakter" minlength="8" maxlength="15" required autofocus>
                </div>

                <div class="mb-4 text-dark text-start">
                    <label class="form-label small fw-bold">Konfirmasi Password Baru</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Ulangi password baru" minlength="8" maxlength="15" required>
                </div>
                
                <button type="submit" class="btn w-100 fw-bold text-white py-2 shadow-sm" style="background-color: #112250; border-radius: 8px;">Simpan Password Baru</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
