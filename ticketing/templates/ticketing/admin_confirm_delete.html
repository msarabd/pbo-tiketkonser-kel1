{% extends 'ticketing/base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 560px;">
    <div class="card bg-dark border-danger shadow">
        <div class="card-header bg-danger text-white d-flex align-items-center gap-2">
            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
            <h5 class="mb-0">Konfirmasi Hapus Data</h5>
        </div>
        <div class="card-body text-white">
            <p class="fs-6">
                Apakah kamu yakin ingin menghapus data 
                <strong class="text-warning">"{{ object }}"</strong> secara permanen dari sistem?
            </p>
            <p class="small text-danger mb-0">
                <i class="bi bi-info-circle"></i> Tindakan ini bersifat destruktif dan data relasi yang terhubung dapat ikut terpengaruh.
            </p>
        </div>
        <div class="card-footer bg-black border-secondary d-flex justify-content-end gap-2 py-3">
            <form method="POST">
                {% csrf_token %}
                <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-danger fw-semibold px-4">
                    <i class="bi bi-trash-fill"></i> Ya, Hapus Sekarang
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
